name: Version bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump manifest version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "custom_components/sonos_web_reboot/manifest.json"
          manifest = json.load(open(path))
          major, minor, patch = manifest["version"].split(".")
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = str(int(major) + 1), "0", "0"
          elif bump == "minor":
              minor, patch = str(int(minor) + 1), "0"
          else:
              patch = str(int(patch) + 1)
          version = f"{major}.{minor}.{patch}"
          manifest["version"] = version
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          PY
      - name: Open bump pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump-${{ steps.bump.outputs.version }}
          delete-branch: true
          commit-message: Bump sonos_web_reboot version to ${{ steps.bump.outputs.version }}
          title: Bump version to ${{ steps.bump.outputs.version }}
          body: |
            Automated version bump from the **Version bump** workflow.

            After merging, release it by running the **Release** workflow
            (`workflow_dispatch`) with `version=${{ steps.bump.outputs.version }}`.
