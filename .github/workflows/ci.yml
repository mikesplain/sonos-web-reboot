name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Verify manifest JSON
        run: python -m json.tool custom_components/sonos_web_reboot/manifest.json > /dev/null
      - name: Build release zip (dry run)
        run: |
          set -eu
          rm -rf dist staging
          mkdir -p dist staging
          cp -R custom_components/sonos_web_reboot/. staging/
          python - <<'PY'
          import json
          import os
          import zipfile

          os.makedirs("dist", exist_ok=True)
          with zipfile.ZipFile("dist/sonos_web_reboot.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk("staging"):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for name in sorted(files):
                      if name.endswith(".pyc"):
                          continue
                      full = os.path.join(root, name)
                      zf.write(full, os.path.relpath(full, "staging"))
          with zipfile.ZipFile("dist/sonos_web_reboot.zip") as zf:
              names = zf.namelist()
          assert "manifest.json" in names, f"manifest.json must sit at the zip root: {names}"
          PY
  test:
    name: Test on Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component pins exactly one Home Assistant
        # release per plugin release, so each entry names the plugin version that
        # pulls the Home Assistant version under test. Bump both together when the
        # plugin publishes support for a newer Home Assistant.
        include:
          - homeassistant: "2026.10.0"
            plugin: "0.13.371"
          - homeassistant: "2026.10.4"
            plugin: "0.13.375"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.10 requires Python >= 3.14.2, and "3.14" resolves to
          # the newest 3.14.x on the runner.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install "pytest-homeassistant-custom-component==${{ matrix.plugin }}"
      - name: Test
        run: python -m pytest
